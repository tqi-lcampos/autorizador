services:
  # Banco de dados MySQL
  mysql_estapar_app:
    image: mysql:8.4.0
    container_name: mysql_estapar_app
    environment:
      MYSQL_DATABASE: estapardb
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: appuser
      MYSQL_PASSWORD: apppassword
      MYSQL_TCP_PORT: 3306
    ports:
      - "3308:3306"
    volumes:
      - mysql_estapar_data:/var/lib/mysql
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 10s
      retries: 5
    restart: always

  # Simulador da garagem (fornece GET /garage e dispara os eventos no webhook)
  simulator:
    image: cfontes0estapar/garage-sim:1.0.0
    container_name: garage_simulator
    ports:
      - "3000:3000"
    networks:
      - app-network

  app:
    build: .
    container_name: cfontes0estapar-app
    ports:
      - "3003:3003"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql_estapar_app:3306/estapardb?useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: appuser
      SPRING_DATASOURCE_PASSWORD: apppassword
      SIMULATOR_BASE_URL: http://simulator:3000
    networks:
      - app-network
    depends_on:
      mysql_estapar_app:
        condition: service_healthy

volumes:
  mysql_estapar_data:

networks:
  app-network:
    driver: bridge
