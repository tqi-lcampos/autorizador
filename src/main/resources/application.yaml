spring:
  application:
    name: autorizador
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3308/autorizadordb?useSSL=false&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME:appuser}
    password: ${SPRING_DATASOURCE_PASSWORD:apppassword}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
  jackson:
    default-property-inclusion: non_null

springdoc:
  default-produces-media-type: application/json
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    display-request-duration: true
    doc-expansion: none
    operationsSorter: alpha
    tagsSorter: alpha
    disable-swagger-default-url: true
    path: /swagger-ui
    enabled: true

server:
  port: 3003

logging:
  level:
    com.fiap.autorizador: INFO
