spring:
  application:
    name: cfontes0estapar
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3308/estapardb?useSSL=false&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME:appuser}
    password: ${SPRING_DATASOURCE_PASSWORD:apppassword}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
  jackson:
    default-property-inclusion: non_null

# Integracao com o simulador da garagem
simulator:
  base-url: ${SIMULATOR_BASE_URL:http://localhost:3000}
  garage-path: /garage
  # Ao iniciar, busca e armazena a configuracao da garagem/vagas
  load-on-startup: true
  connect-timeout: 5s
  read-timeout: 10s

springdoc:
  default-produces-media-type: application/json
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    display-request-duration: true
    doc-expansion: none
    operationsSorter: alpha
    tagsSorter: alpha
    disable-swagger-default-url: true
    path: /swagger-ui
    enabled: true

server:
  port: 3003

logging:
  level:
    com.fiap.cfontes0estapar: INFO
