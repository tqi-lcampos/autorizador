spring:
  datasource:
    url: jdbc:h2:mem:estapardb;DB_CLOSE_DELAY=-1;MODE=MySQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  flyway:
    enabled: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

simulator:
  base-url: http://localhost:9999
  garage-path: /garage
  load-on-startup: false

server:
  port: 0
